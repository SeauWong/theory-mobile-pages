<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>系统侦察任务</title>
    <meta
      name="description"
      content="一款手机竖版轻游戏，用结构主义、建构主义与认知科学的方法，训练你在 AI 信息爆炸时代快速认识一个系统，而不是把思考外包给 AI。"
    />
    <meta name="theme-color" content="#f5f1ea" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="系统侦察任务" />
    <meta
      property="og:description"
      content="在五个短关卡里学会如何划定边界、扫描结构、建构模型、认知压缩，并把 AI 当作脚手架而不是代脑。"
    />
    <meta property="og:image" content="./share-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="系统侦察任务" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="系统侦察任务" />
    <meta
      name="twitter:description"
      content="用手机竖版轻游戏的方式，学习如何在 AI 时代快速认识系统，而不是让 AI 替你思考。"
    />
    <meta name="twitter:image" content="./share-cover.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#game-stage">跳到任务</a>
    <div class="page-backdrop" aria-hidden="true">
      <div class="page-orb page-orb-a"></div>
      <div class="page-orb page-orb-b"></div>
      <div class="page-grid"></div>
    </div>

    <main class="app-shell">
      <section class="phone-stage" aria-label="系统侦察任务">
        <header class="chrome">
          <div class="brand-block">
            <p class="brand-kicker">System Recon</p>
            <h1>系统侦察任务</h1>
          </div>
          <button id="reset-button" class="ghost-button" type="button">重新开始</button>
        </header>

        <section class="hud" aria-label="任务状态">
          <div class="hud-row">
            <div>
              <p class="hud-label">当前进度</p>
              <p class="hud-value" id="hud-progress-label">引导</p>
            </div>
            <div class="score-pill" id="score-pill">
              <span>主动思考值</span>
              <strong id="agency-score">100</strong>
            </div>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="progress-bar"></span>
          </div>
          <div class="hud-row hud-row-secondary">
            <div>
              <p class="hud-label">任务标题</p>
              <p class="hud-value" id="hud-title">系统侦察</p>
            </div>
            <button id="ai-shortcut-button" class="shortcut-button" type="button">
              让 AI 先告诉我
            </button>
          </div>
        </section>

        <div class="live-region" id="live-region" aria-live="polite"></div>
        <section class="game-stage" id="game-stage" tabindex="-1"></section>
      </section>
    </main>

    <noscript>
      <div class="noscript-card">
        这个项目需要 JavaScript 才能运行，因为它是一个状态驱动的轻交互网页游戏。
      </div>
    </noscript>

    <script src="./script.js"></script>
  </body>
</html>
